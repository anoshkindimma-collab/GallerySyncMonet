name: Build Monet Sync APK
on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: |
          unzip -o band11_picsync_apk.zip -d work_apk
          cd work_apk
          gradle assembleRelease
          mkdir -p ../release_apks
          find app/build/outputs/apk -name "*.apk" -exec cp {} ../release_apks/ \;
      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: Gallery Sync Monet APK #${{ github.run_number }}
          files: release_apks/*.apk
          
