name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project zip if needed
        run: |
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            ZIP_FILE=$(ls -1 *apk*.zip 2>/dev/null | head -n 1)
            if [ -z "$ZIP_FILE" ]; then
              ZIP_FILE=$(ls -1 *.zip 2>/dev/null | head -n 1)
            fi
            if [ -z "$ZIP_FILE" ]; then
              echo "Не найден settings.gradle.kts или zip с проектом в корне репо!"
              exit 1
            fi
            echo "Распаковка $ZIP_FILE..."
            unzip -o "$ZIP_FILE" -d .
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle & Wrapper if missing
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure gradlew and wrapper jar exist
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Find built APKs
        run: find app/build/outputs/apk -type f -name "*.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: band11-picsync-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
