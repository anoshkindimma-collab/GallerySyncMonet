name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project zip if needed
        run: |
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            ZIP_FILE=$(ls -1 *apk*.zip 2>/dev/null | grep -v -i "ebook" | head -n 1)
            if [ -z "$ZIP_FILE" ]; then
              ZIP_FILE=$(ls -1 *.zip 2>/dev/null | grep -v -i "ebook" | head -n 1)
            fi
            if [ -z "$ZIP_FILE" ]; then
              echo "Не найден zip с проектом APK в корне репо!"
              exit 1
            fi
            echo "Распаковка $ZIP_FILE..."
            unzip -o "$ZIP_FILE" -d .
          fi

      - name: Extract XMS Wearable SDK from eBook APK if present
        run: |
          EBOOK_FILE=$(ls -1 *eBook* 2>/dev/null | head -n 1)
          if [ -n "$EBOOK_FILE" ]; then
            echo "Найден $EBOOK_FILE — извлекаем classes11.dex в app/libs/xms-wearable.jar..."
            mkdir -p tmp_ebook app/libs
            unzip -o "$EBOOK_FILE" "classes11.dex" -d tmp_ebook || true
            if [ -f tmp_ebook/classes11.dex ]; then
              sudo apt-get update -qq && sudo apt-get install -y -qq dex2jar
              d2j-dex2jar tmp_ebook/classes11.dex -o app/libs/xms-wearable.jar --force
              ls -lh app/libs/xms-wearable.jar
            fi
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Find built APKs
        run: find app/build/outputs/apk -type f -name "*.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: band11-picsync-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error       
